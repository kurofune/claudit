# claudit pricing — USD per million tokens.
#
# Every rate below was re-verified against
# https://platform.claude.com/docs/en/about-claude/pricing on 2026-07-26
# (Opus 5 added then). Entries are tagged with the date they were last
# checked — refresh those tags if you re-check the page.
#
# Cache pricing follows Anthropic's standard ratios off the input rate:
#   cache_read     = input * 0.10
#   cache_write_5m = input * 1.25
#   cache_write_1h = input * 2.00
#
# 1M-context-window pricing: Fable 5, Mythos 5, Opus 5, Opus 4.6, Opus 4.7,
# Opus 4.8, Sonnet 5, and Sonnet 4.6 include the full 1M context at *standard*
# rates — no premium tier. The "[1m]" suffix claudit may see in the wild is
# just a context-mode marker, not a pricing tier, so we list those at the same
# prices as their base model.
#
# Rate changes: a model's top-level fields are the rate in effect *now*.
# When a rate changes, move the outgoing rate into a `rates:` entry tagged
# with the last date it applied (inclusive, UTC) and update the top-level
# fields to the new rate — see claude-sonnet-5 below. Turns are then priced
# at whatever was in effect when they ran. Periods may be listed in any
# order; a turn with no usable timestamp prices at the current rate.
#
# Known gap (needs code, not just a rate edit — see README):
#   * Fast mode (Opus 5 / Opus 4.8, $10 / $50) is a per-turn rate, not a
#     per-model one. Transcripts carry the "speed" field that would select
#     it, but claudit keys pricing on model id alone, so fast-mode turns
#     price at the standard rate.

models:
  # ── Fable 5 / Mythos 5 — $10 / $50 base ──
  # Mythos 5 is limited-availability (Project Glasswing) but shares Fable 5's
  # rate card; claudit prices it identically if the id shows up in a session.
  claude-fable-5:                   # verified 2026-07-26
    input_per_mtok: 10.00
    output_per_mtok: 50.00
    cache_read_per_mtok: 1.00
    cache_write_5m_per_mtok: 12.50
    cache_write_1h_per_mtok: 20.00

  "claude-fable-5[1m]":              # verified 2026-07-26 — 1M context bundled at standard rates
    input_per_mtok: 10.00
    output_per_mtok: 50.00
    cache_read_per_mtok: 1.00
    cache_write_5m_per_mtok: 12.50
    cache_write_1h_per_mtok: 20.00

