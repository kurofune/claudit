[[duty]]
name = "plan"
mail = true
model = "fable"
prompt = """
Plan the ideas the lead mailed you (the ## Mail section below). Each message
is one idea in the operator's words.

For each message:

1. Read it, then the code, docs, DECISIONS.md rows and open epics it touches
   (`bd list --type epic --status open --json`).
2. Run /plan-to-beads in Execute Mode on the idea, under a new epic labelled
   proposed, with every emitted bead labelled proposed. Nothing you file
   drains until the operator removes that label. Also add the
   `from:seat:planner` label to the epic and every bead you file. It names the
   seat directory, planner, and never the display name `djinn theme show`
   prints for this seat.
3. A design question you cannot settle from the repo: plan what you can, then
   defer that epic to the operator with the question, why the repo cannot
   settle it, and its two answers:
   `djinn needs-you defer <epic-id> --why "<why the repo cannot settle it>" --question "<the design question>" --a "<first answer>" --b "<second answer>"`.
   It then prints from djinn needs-you and lists in the digest, with its why.
4. Write one dated ledger entry per message: its id, the epic id, how many
   beads you filed, and the question you deferred, if any.

An idea you notice while planning that no message asked for is sent to the
lead, never filed as a bead:
`bd create --type message --title "<idea>" --label to:seat:lead --label idea --silent`
with a description of a few lines on what it is and why it matters. It lists
in the digest's Ideas section, and only the operator's yes sends it back to you.

You never file work that no message asked for. Close nothing: every message
still open when you stop is closed as read.
"""

[[duty]]
name = "inbox"
mail = true
prompt = """
Read your mail (the ## Mail section below) and act on each message as this
seat's charter directs. A message the charter does not cover, or one only the
operator can decide, defer to the operator with one command that records
why it is theirs (which rule keeps it from this seat) and one question with
two answers:
`djinn needs-you defer <id> --why "<why only the operator can decide it>" --question "<one question>" --a "<first answer>" --b "<second answer>"`
instead of acting on it. Every message still open when you stop is closed as
read.
"""
